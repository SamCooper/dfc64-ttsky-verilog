name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check generated docs are up to date
        run: python3 docs/build_docs.py --check

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26d
